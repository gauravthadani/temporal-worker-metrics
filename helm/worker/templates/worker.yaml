apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: {{ .Values.image }}:{{ .Values.tag }}
        imagePullPolicy: IfNotPresent
        args:
        - "-target-host={{ if .Values.temporal.apiKey.enabled }}{{ .Values.temporal.apiKey.host }}{{ else }}{{ .Values.temporal.mtls.host }}{{ end }}"
        - "-namespace={{ .Values.temporal.namespace }}"
        {{- if .Values.temporal.mtls.enabled }}
        - "-tls-cert-path=/etc/temporal/tls/client.pem"
        - "-tls-key-path=/etc/temporal/tls/client.key"
        {{- end }}
        {{- if .Values.temporal.apiKey.enabled }}
        env:
        - name: TEMPORAL_CLIENT_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.temporal.apiKey.secretName }}
              key: {{ .Values.temporal.apiKey.secretKey }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.port }}
        {{- if .Values.temporal.mtls.enabled }}
        volumeMounts:
        - name: temporal-tls
          mountPath: /etc/temporal/tls
          readOnly: true
        {{- end }}
      {{- if .Values.temporal.mtls.enabled }}
      volumes:
      - name: temporal-tls
        secret:
          secretName: {{ .Values.temporal.mtls.secretName }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector:
    app: worker
  ports:
  - port: {{ .Values.port }}
    targetPort: {{ .Values.port }}
  type: ClusterIP
