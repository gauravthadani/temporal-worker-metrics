apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: worker
spec:
  replicas: {{ .Values.replicas }}
  rollout:
    strategy: Progressive
    steps:
      - rampPercentage: 10
        pauseDuration: 1m
      # - rampPercentage: 50
      #   pauseDuration: 10m
  sunset: {}
  workerOptions:
    connectionRef:
      name: local
    temporalNamespace: default
    {{- if .Values.buildID }}
    unsafeCustomBuildID: {{ .Values.buildID }}
    {{- end }}
  template:
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
      - name: worker
        image: {{ .Values.image }}:{{ .Values.tag }}
        imagePullPolicy: IfNotPresent
        args:
        - "-target-host=temporal-proxy:8443"
        env:
        - name: TEMPORAL_ADDRESS
          value: "temporal-proxy:8443"
        - name: TEMPORAL_NAMESPACE
          value: "default"
        ports:
        - containerPort: {{ .Values.port }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector:
    temporal.io/deployment-name: worker
  ports:
  - port: {{ .Values.port }}
    targetPort: {{ .Values.port }}
  type: ClusterIP
